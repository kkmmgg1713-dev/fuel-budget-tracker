<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>유류대 관리장부</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #191c2b;
            --bg-card: #272a40;
            --border-card: #363a54;
            --text-main: #ffffff;
            --text-sub: #8d93b0;
            --color-purple: #775cff;
            --color-green: #68d372;
            --color-red: #ff5b5b;
            --color-blue: #6db1ff;
            --bg-input-area: #1f2235;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 0.6rem;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden; /* 한 화면에 꽉 차게 */
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 0.6rem; /* 카드 간 간격 최소화 */
            height: 100%;
            overflow-y: auto; /* 만약 기기가 너무 작으면 내부 스크롤 허용 */
            padding-bottom: 1rem;
        }
        
        /* 스크롤바 숨기기 */
        .container::-webkit-scrollbar { display: none; }
        .container { -ms-overflow-style: none; scrollbar-width: none; }

        /* 상단 배너 */
        .top-banner {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 0.8rem;
            text-align: center;
            font-weight: 700;
            color: var(--color-blue);
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 0.2rem;
        }

        /* 카드 공통 스타일 */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px; /* 둥글둥글한 모서리 */
            padding: 0.8rem 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        /* 카드 헤더 (제목 + 토글버튼) */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .toggle-btn {
            background-color: var(--color-purple);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.35rem 0.7rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .toggle-btn:active { opacity: 0.8; transform: scale(0.95); }

        /* 금액 표시 영역 */
        .amount-display {
            text-align: right;
            font-size: 2.2rem; /* 높이를 위해 폰트 살짝 조정 */
            font-weight: 700;
            line-height: 1.1;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .amount-display span {
            font-size: 1rem;
            color: var(--text-sub);
            font-weight: 400;
            margin-left: 0.2rem;
        }
        
        .amt-blue { color: var(--color-blue); text-shadow: 0 0 10px rgba(109,177,255,0.4); animation: pulseBlue 1.5s infinite alternate; }
        .amt-green { color: var(--color-green); }
        .amt-red { color: var(--color-red); }

        @keyframes pulseBlue {
            from { text-shadow: 0 0 5px rgba(109,177,255,0.3); }
            to { text-shadow: 0 0 15px rgba(109,177,255,0.7); }
        }

        /* 폼 영역 (어두운 배경 띠) */
        .form-row {
            display: flex;
            gap: 0.4rem;
            background-color: var(--bg-input-area);
            padding: 0.4rem;
            border-radius: 12px;
            margin-top: 0.2rem;
        }
        
        /* 입력칸 박스 */
        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 0.2rem 0.4rem;
        }
        .input-group label {
            font-size: 0.6rem;
            color: var(--text-sub);
            margin-bottom: 0.1rem;
        }
        .input-group input {
            background: transparent;
            border: none;
            color: white;
            font-size: 0.85rem;
            width: 100%;
            outline: none;
            padding: 0;
            font-family: inherit;
        }
        /* Date 픽커 아이콘 색상 보정 */
        .input-group input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1); opacity: 0.5; padding: 0; margin: 0;
        }
        
        /* 추가 버튼 */
        .add-btn {
            background-color: var(--color-green);
            color: #ffffff; /* 스크린샷대로 밝은 흰/녹 텍스트 계열 혹은 어두운 텍스트 설정 가능 */
            border: none;
            border-radius: 8px;
            padding: 0 0.9rem;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .add-btn:active { transform: scale(0.95); }

        /* 세부내역 리스트 */
        .details-container {
            display: none;
            flex-direction: column;
            gap: 0.3rem;
            margin-top: 0.3rem;
            max-height: 150px;
            overflow-y: auto;
        }
        .details-container.open { display: flex; }
        
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-input-area);
            padding: 0.4rem 0.6rem;
            border-radius: 8px;
            font-size: 0.8rem;
        }
        .item-info { display: flex; gap: 0.5rem; align-items: center; }
        .item-label { color: var(--text-sub); width: 65px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.75rem;}
        .item-amt { font-weight: 600; font-size: 0.85rem; }
        .del-btn {
            background: rgba(255,91,91,0.15);
            color: var(--color-red);
            border: none;
            border-radius: 6px;
            padding: 0.2rem 0.4rem;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .empty-text { text-align: center; color: var(--text-sub); font-size: 0.75rem; padding: 0.5rem 0; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- 최상단 배너 -->
        <div class="top-banner">
            ⛽ 유류대 잔여 금액 확인
        </div>

        <!-- 1. 유류대 잔여금액 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">💰 유류대 잔여금액</div>
            </div>
            <div class="amount-display amt-blue" id="remainingAmount">0<span>원</span></div>
        </div>

        <!-- 2. 유류대 예산금액 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">📊 유류대 예산금액</div>
                <button class="toggle-btn" id="toggleBudgetBtn" onclick="toggleDetails('budgetList', 'toggleBudgetBtn')">세부내역 보기</button>
            </div>
            <div class="amount-display amt-green" id="totalBudgetDisplay">0<span>원</span></div>
            
            <form class="form-row" id="budgetForm">
                <div class="input-group">
                    <label>출장일</label>
                    <input type="date" id="budgetDateInput" required>
                </div>
                <div class="input-group">
                    <label>금액</label>
                    <input type="number" id="budgetAmountInput" placeholder="금액 입력" required min="0">
                </div>
                <button type="submit" class="add-btn">추가</button>
            </form>
            
            <div class="details-container" id="budgetList"></div>
        </div>

        <!-- 3. 유류대 사용금액 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">🛢️ 유류대 사용금액</div>
                <button class="toggle-btn" id="toggleUsageBtn" onclick="toggleDetails('usageList', 'toggleUsageBtn')">세부내역 보기</button>
            </div>
            <div class="amount-display amt-red" id="totalUsageDisplay">0<span>원</span></div>
            
            <form class="form-row" id="usageForm">
                <div class="input-group">
                    <label>내역(선택)</label>
                    <input type="text" id="usageDescInput" placeholder="메모">
                </div>
                <div class="input-group">
                    <label>금액</label>
                    <input type="number" id="usageAmountInput" placeholder="금액 입력" required min="0">
                </div>
                <button type="submit" class="add-btn">추가</button>
            </form>

            <div class="details-container" id="usageList"></div>
        </div>

    </div>

    <script>
        // 토글 함수
        window.toggleDetails = function(listId, btnId) {
            const listEl = document.getElementById(listId);
            const btnEl = document.getElementById(btnId);
            if (listEl.classList.contains('open')) {
                listEl.classList.remove('open');
                btnEl.textContent = '세부내역 보기';
            } else {
                listEl.classList.add('open');
                btnEl.textContent = '세부내역 닫기';
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const remainingAmount = document.getElementById('remainingAmount');
            const totalBudgetDisplay = document.getElementById('totalBudgetDisplay');
            const totalUsageDisplay = document.getElementById('totalUsageDisplay');
            
            const budgetForm = document.getElementById('budgetForm');
            const budgetDateInput = document.getElementById('budgetDateInput');
            const budgetAmountInput = document.getElementById('budgetAmountInput');
            const budgetList = document.getElementById('budgetList');

            const usageForm = document.getElementById('usageForm');
            const usageDescInput = document.getElementById('usageDescInput');
            const usageAmountInput = document.getElementById('usageAmountInput');
            const usageList = document.getElementById('usageList');

            let budgets = [];
            let usages = [];

            function loadData() {
                const storedBudgets = localStorage.getItem('app_budgets');
                const storedUsages = localStorage.getItem('app_usages');
                if (storedBudgets) budgets = JSON.parse(storedBudgets);
                if (storedUsages) usages = JSON.parse(storedUsages);
                updateUI();
            }

            function saveData() {
                localStorage.setItem('app_budgets', JSON.stringify(budgets));
                localStorage.setItem('app_usages', JSON.stringify(usages));
            }

            function formatCurrency(amount) {
                return amount.toLocaleString('ko-KR');
            }

            function updateUI() {
                const totalBudget = budgets.reduce((sum, item) => sum + item.amount, 0);
                const totalUsage = usages.reduce((sum, item) => sum + item.amount, 0);
                const remaining = totalBudget - totalUsage;

                remainingAmount.innerHTML = formatCurrency(remaining) + '<span>원</span>';
                totalBudgetDisplay.innerHTML = formatCurrency(totalBudget) + '<span>원</span>';
                totalUsageDisplay.innerHTML = formatCurrency(totalUsage) + '<span>원</span>';

                // Render Budgets
                budgetList.innerHTML = '';
                if (budgets.length === 0) {
                    budgetList.innerHTML = '<div class="empty-text">예산 내역이 없습니다.</div>';
                } else {
                    budgets.slice().reverse().forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'list-item';
                        div.innerHTML = `
                            <div class="item-info">
                                <span class="item-label">${item.date}</span>
                                <span class="item-amt amt-green">+${formatCurrency(item.amount)}</span>
                            </div>
                            <button class="del-btn" onclick="deleteBudget('${item.id}')">삭제</button>
                        `;
                        budgetList.appendChild(div);
                    });
                }

                // Render Usages
                usageList.innerHTML = '';
                if (usages.length === 0) {
                    usageList.innerHTML = '<div class="empty-text">사용 내역이 없습니다.</div>';
                } else {
                    usages.slice().reverse().forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'list-item';
                        const descText = item.desc ? item.desc : '사용액';
                        div.innerHTML = `
                            <div class="item-info">
                                <span class="item-label">${descText}</span>
                                <span class="item-amt amt-red">-${formatCurrency(item.amount)}</span>
                            </div>
                            <button class="del-btn" onclick="deleteUsage('${item.id}')">삭제</button>
                        `;
                        usageList.appendChild(div);
                    });
                }
            }

            // Budget Submit
            budgetForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const date = budgetDateInput.value;
                const amount = parseInt(budgetAmountInput.value, 10);
                if (date && !isNaN(amount) && amount > 0) {
                    budgets.push({ id: Date.now().toString(), date, amount });
                    saveData();
                    updateUI();
                    budgetAmountInput.value = '';
                    if (!budgetList.classList.contains('open')) toggleDetails('budgetList', 'toggleBudgetBtn');
                }
            });

            // Usage Submit
            usageForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const desc = usageDescInput.value.trim();
                const amount = parseInt(usageAmountInput.value, 10);
                if (!isNaN(amount) && amount > 0) {
                    usages.push({ id: Date.now().toString(), desc, amount });
                    saveData();
                    updateUI();
                    usageDescInput.value = '';
                    usageAmountInput.value = '';
                    if (!usageList.classList.contains('open')) toggleDetails('usageList', 'toggleUsageBtn');
                }
            });

            // Deletes
            window.deleteBudget = function(id) {
                if(confirm('이 예산 내역을 삭제하시겠습니까?')) {
                    budgets = budgets.filter(b => b.id !== id);
                    saveData();
                    updateUI();
                }
            }
            window.deleteUsage = function(id) {
                if(confirm('이 사용 내역을 삭제하시겠습니까?')) {
                    usages = usages.filter(u => u.id !== id);
                    saveData();
                    updateUI();
                }
            }

            // Init
            loadData();
            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            budgetDateInput.value = (new Date(today - offset)).toISOString().split('T')[0];
        });
    </script>
</body>
</html>
